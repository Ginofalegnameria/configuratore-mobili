<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Professionale - MobileSuMisura Style</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1300px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 350px; }
        .preview-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1.5; min-width: 400px; }
        h2, h3 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { font-size: 0.85em; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 4px; }
        .row-item { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #28a745; }
        .result-box { margin-top: 20px; padding: 15px; background: #28a745; color: white; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; }
        svg { background: #fff; border: 1px solid #ddd; width: 100%; height: auto; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #007bff; color: white; }
        .info-txt { font-size: 0.75em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Parametri Struttura</h2>
        <div class="grid">
            <div><label>Larghezza Tot (mm)</label><input type="number" id="L" value="1200" oninput="run()"></div>
            <div><label>Altezza Tot (mm)</label><input type="number" id="A" value="2000" oninput="run()"></div>
            <div><label>Profondità (mm)</label><input type="number" id="P" value="600" oninput="calcola()"></div>
            <div><label>Zoccolo (mm)</label><input type="number" id="Z" value="100" oninput="run()"></div>
            <div><label>Spessore Scocca (mm)</label><input type="number" id="SP" value="19" oninput="run()"></div>
            <div><label>Spessore Schienale (mm)</label><input type="number" id="SPS" value="4" oninput="run()"></div>
        </div>

        <label>Materiale Principale</label>
        <select id="mat" onchange="calcola()" style="margin-bottom: 15px;">
            <optgroup label="Economici">
                <option value="35">Truciolare Melaminico Bianco (35€/mq)</option>
                <option value="42">Truciolare Melaminico Colore/Legno (42€/mq)</option>
            </optgroup>
            <optgroup label="Standard">
                <option value="55" selected>Laminato Bianco (55€/mq)</option>
                <option value="70">Laminato Effetto Legno (70€/mq)</option>
            </optgroup>
            <optgroup label="Premium">
                <option value="120">Laccato Opaco (120€/mq)</option>
                <option value="150">Laccato Lucido (150€/mq)</option>
            </optgroup>
        </select>

        <h3>Configurazione Vani</h3>
        <label>Numero Divisori Verticali</label>
        <input type="number" id="numDiv" value="1" min="0" max="4" oninput="run()">
        
        <div id="contRipiani" style="margin-top:15px;"></div>

        <div class="result-box" id="totale">€ 0.00</div>
        <p class="info-txt">* Prezzo calcolato con sfrido 20% e schienali frazionati.</p>
    </div>

    <div class="preview-card">
        <h3>Anteprima Frontale</h3>
        <svg id="disegno" viewBox="0 0 500 500"></svg>
        
        <h3>Distinta Tagli (Misure Finite)</h3>
        <table id="tabellaTagli">
            <thead>
                <tr><th>Pezzo</th><th>Q.tà</th><th>H (mm)</th><th>L (mm)</th><th>Sp.</th></tr>
            </thead>
            <tbody id="corpoTabella"></tbody>
        </table>
    </div>
</div>

<script>
    function run() {
        renderInputs();
        calcola();
    }

    function renderInputs() {
        const n = parseInt(document.getElementById('numDiv').value) || 0;
        const cont = document.getElementById('contRipiani');
        let html = "";
        for(let i=0; i <= n; i++) {
            html += `<div class="row-item">
                <strong>Vano ${i+1}</strong>
                <div class="grid">
                    <div><label>N° Ripiani</label><input type="number" id="rip_qta_${i}" value="1" min="0" oninput="calcola()"></div>
                    <div><label>H Ripiani (mm)</label><input type="number" id="rip_h_${i}" value="400" oninput="calcola()"></div>
                </div>
            </div>`;
        }
        if(cont.dataset.num != n) {
            cont.innerHTML = html;
            cont.dataset.num = n;
        }
    }

    function calcola() {
        const L = parseFloat(document.getElementById('L').value) || 0;
        const A = parseFloat(document.getElementById('A').value) || 0;
        const P = parseFloat(document.getElementById('P').value) || 0;
        const Z = parseFloat(document.getElementById('Z').value) || 0;
        const SP = parseFloat(document.getElementById('SP').value) || 0;
        const SPS = parseFloat(document.getElementById('SPS').value) || 0;
        const nDiv = parseInt(document.getElementById('numDiv').value) || 0;
        const prezzoMq = parseFloat(document.getElementById('mat').value);

        const hFianco = A - Z;
        const lInternaTot = L - (SP * 2) - (nDiv * SP);
        const lVano = lInternaTot / (nDiv + 1);
        const pInterna = P - 20; 

        let pezzi = [
            { n: "Fianchi Esterni", q: 2, a: hFianco, b: P, s: SP },
            { n: "Base + Cappello", q: 2, a: L - (SP*2), b: P, s: SP },
            { n: "Zoccolo (Fronte/Retro)", q: 2, a: L, b: Z, s: SP }
        ];

        // Schienali divisi per vano (con sormonto sui divisori/fianchi)
        pezzi.push({ n: `Schienali Vano`, q: nDiv + 1, a: hFianco, b: lVano + SP, s: SPS });

        if(nDiv > 0) pezzi.push({ n: "Divisori Verticali", q: nDiv, a: hFianco - (SP*2), b: pInterna, s: SP });

        for(let i=0; i <= nDiv; i++) {
            let qta = parseInt(document.getElementById(`rip_qta_${i}`)?.value) || 0;
            if(qta > 0) pezzi.push({ n: `Ripiani Vano ${i+1}`, q: qta, a: lVano, b: pInterna, s: SP });
        }

        let htmlT = "";
        let mq = 0;
        pezzi.forEach(p => {
            htmlT += `<tr><td>${p.n}</td><td>${p.q}</td><td>${Math.round(p.a)}</td><td>${Math.round(p.b)}</td><td>${p.s}</td></tr>`;
            mq += (p.a * p.b * p.q) / 1000000;
        });
        document.getElementById('corpoTabella').innerHTML = htmlT;
        document.getElementById('totale').innerText = "€ " + (mq * prezzoMq * 1.2).toFixed(2);

        // Disegno SVG
        const sc = 460 / Math.max(L, A);
        const w = L*sc, h = A*sc, sp = SP*sc, z = Z*sc;
        let svg = `<rect x="20" y="20" width="${w}" height="${h}" fill="none" stroke="#333" stroke-width="1"/>`;
        svg += `<rect x="20" y="${20+h-z}" width="${w}" height="${z}" fill="#ddd" stroke="#333"/>`;
        
        for(let i=0; i < nDiv; i++) {
            let xDiv = 20 + sp + (lVano*sc)*(i+1) + (sp*i);
            svg += `<rect x="${xDiv}" y="${20+sp}" width="${sp}" height="${h-z-sp*2}" fill="#bbb"/>`;
        }
        for(let i=0; i <= nDiv; i++) {
            let qta = parseInt(document.getElementById(`rip_qta_${i}`)?.value) || 0;
            let hR = parseFloat(document.getElementById(`rip_h_${i}`)?.value) || 0;
            for(let j=0; j<qta; j++) {
                let yR = 20 + h - z - sp - (hR*sc*(j+1));
                let xStart = 20 + sp + (i * (lVano*sc + sp));
                svg += `<line x1="${xStart}" y1="${yR}" x2="${xStart + lVano*sc}" y2="${yR}" stroke="red" stroke-dasharray="2"/>`;
            }
        }
        document.getElementById('disegno').innerHTML = svg;
    }
    window.onload = run;
</script>
</body>
</html>
