<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Preventivatore Mobili</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; margin: 10px 0; padding: 8px; }
        #prezzo { font-size: 24px; color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Il mio Mobile su Misura</h2>
        
        <label>Larghezza (mm)</label>
        <input type="number" id="L" value="1000" oninput="calcola()">
        
        <label>Altezza (mm)</label>
        <input type="number" id="A" value="2000" oninput="calcola()">
        
        <label>Profondità (mm)</label>
        <input type="number" id="P" value="600" oninput="calcola()">

        <label>Materiale</label>
        <select id="mat" onchange="calcola()">
            <option value="40">Laminato Bianco (40€/mq)</option>
            <option value="60">Effetto Legno (60€/mq)</option>
            <option value="120">Laccato Opaco (120€/mq)</option>
        </select>

        <p>Prezzo Stimato:</p>
        <div id="prezzo">€ 0.00</div>
    </div>

    <script>
        function calcola() {
            let l = document.getElementById('L').value / 1000;
            let a = document.getElementById('A').value / 1000;
            let p = document.getElementById('P').value / 1000;
            let prezzoMq = document.getElementById('mat').value;

            // Calcolo approssimativo superficie esterna
            let superficie = (l * a * 2) + (l * p * 2) + (a * p * 2);
            let totale = superficie * prezzoMq;

            document.getElementById('prezzo').innerText = "€ " + totale.toFixed(2);
        }
        window.onload = calcola;
    </script>
</body>
</html>
