<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Falegnameria - Calcolo Bordi Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; border-bottom: 2px solid #007bff; padding-bottom: 8px; color: #007bff; font-size: 1.1em; }
        .header-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .main-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.85em; font-weight: bold; display: block; margin-bottom: 4px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        #contVani { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 10px; }
        .row-item { background: #f8f9fa; padding: 15px; border-radius: 8px; border-top: 4px solid #007bff; }
        .output-area { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        #svgContainer { background: white; padding: 20px; border: 1px solid #ddd; border-radius: 8px; min-height: 250px; display: flex; justify-content: center; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 0.9em; }
        th { background: #007bff; color: white; }
        .result-box { width: 100%; background: #2c3e50; color: white; padding: 25px; border-radius: 12px; }
        #totale-big { font-size: 42px; font-weight: bold; color: #2ecc71; text-align: center; border-bottom: 1px solid #444; padding-bottom: 15px; margin-bottom: 15px; }
        .valore-analitico { text-align: right; font-weight: bold; }
        .controlli-stampa { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; }
        .btn { padding: 15px 25px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-tecnico { background: #7f8c8d; }
        .btn-cliente { background: #27ae60; }
        @media print { .controlli-stampa, .header-grid, .main-grid, .no-print { display: none !important; } .section { box-shadow: none; border: none; } body { background: white; padding: 0; } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="section header-grid">
        <div><label>CLIENTE</label><input type="text" id="nomeCliente" placeholder="Progetto" oninput="aggiornaDati()"></div>
        <div><label>MATERIALE</label>
            <select id="mat" onchange="aggiornaDati()">
                <option value="25">Truciolare (25€/mq)</option>
                <option value="55" selected>Laminato (55€/mq)</option>
            </select>
        </div>
        <div><label>SPESSORE BORDO</label>
            <select id="spessoreBordo" onchange="aggiornaDati()">
                <option value="0.50">ABS 0.4 mm (0.50€/m)</option>
                <option value="1.20" selected>ABS 1.0 mm (1.20€/m)</option>
                <option value="2.10">ABS 2.0 mm (2.10€/m)</option>
                <option value="3.50">Legno massello (3.50€/m)</option>
            </select>
        </div>
        <div><label>LATI BORDATI</label>
            <select id="latiBordati" onchange="aggiornaDati()">
                <option value="1">Solo Frontale</option>
                <option value="4">Tutti i 4 lati</option>
            </select>
        </div>
    </div>

    <div class="main-grid">
        <div class="section">
            <h3>MISURE STRUTTURA (mm)</h3>
            <div class="input-grid">
                <div><label>L (Larghezza)</label><input type="number" id="L" value="1000" oninput="aggiornaDati()"></div>
                <div><label>A (Altezza)</label><input type="number" id="A" value="2000" oninput="aggiornaDati()"></div>
                <div><label>P (Profondità)</label><input type="number" id="P" value="600" oninput="aggiornaDati()"></div>
                <div><label>Zoccolo</label><input type="number" id="Z" value="100" oninput="aggiornaDati()"></div>
                <div><label>Spessore Pannello</label><input type="number" id="SP" value="19" oninput="aggiornaDati()"></div>
                <div><label>Ricarico %</label><input type="number" id="ricarico" value="30" oninput="aggiornaDati()"></div>
            </div>
        </div>
        <div class="section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>VANI E ACCESSORI</h3>
                <div><label>DIVISORI:</label><input type="number" id="numDiv" value="1" min="0" oninput="initVani()" style="width:60px;"></div>
            </div>
            <div id="contVani"></div>
        </div>
    </div>

    <div class="section output-area">
        <h1 style="margin:0">PREVENTIVO: <span id="labelCli">Cliente</span></h1>
        <div id="svgContainer"></div>

        <div style="width:100%; display:grid; grid-template-columns: 1.2fr 1fr; gap:20px;">
            <div id="sezioneTagli">
                <h3>DISTINTA TECNICA TAGLI</h3>
                <table id="tabellaTagli">
                    <thead><tr><th>Pezzo</th><th>Q.tà</th><th>H</th><th>L</th><th>Bordo (m)</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="result-box">
                <div id="totale-big">€ 0.00</div>
                <table style="width:100%; color:white;" id="tabellaCosti"></table>
            </div>
        </div>
    </div>
</div>

<div class="controlli-stampa">
    <button class="btn btn-tecnico" onclick="window.print()">🖨️ STAMPA TECNICA</button>
    <button class="btn btn-cliente" onclick="stampaCliente()">📄 EXPORT CLIENTE</button>
</div>

<script>
    function initVani() {
        const n = parseInt(document.getElementById('numDiv').value) || 0;
        const cont = document.getElementById('contVani');
        cont.innerHTML = "";
        for(let i=0; i <= n; i++) {
            cont.innerHTML += `
            <div class="row-item">
                <strong>Vano ${i+1}</strong>
                <div class="input-grid">
                    <div><label>Ripiani</label><input type="number" id="q_${i}" value="3" oninput="aggiornaDati()"></div>
                    <div><label><input type="checkbox" id="anta_${i}" checked onchange="aggiornaDati()"> Anta</label></div>
                </div>
            </div>`;
        }
        aggiornaDati();
    }

    function aggiornaDati() {
        const L=Number(document.getElementById('L').value), A=Number(document.getElementById('A').value), P=Number(document.getElementById('P').value), Z=Number(document.getElementById('Z').value), SP=Number(document.getElementById('SP').value), nD=Number(document.getElementById('numDiv').value), pM=Number(document.getElementById('mat').value), cBordoMt=Number(document.getElementById('spessoreBordo').value), lati=Number(document.getElementById('latiBordati').value), ricarico=Number(document.getElementById('ricarico').value)/100 + 1;
        
        document.getElementById('labelCli').innerText = document.getElementById('nomeCliente').value || "Cliente";
        
        let nRipiani = 0, mqAnte = 0, metriBordo = 0;
        let larghVano = (L - (SP * 2) - (nD * SP)) / (nD + 1);

        for(let i=0; i <= nD; i++) {
            let rip = Number(document.getElementById('q_'+i)?.value) || 0;
            nRipiani += rip;
            if(document.getElementById('anta_'+i)?.checked) mqAnte += ((A-Z) * (larghVano + SP/2)) / 1000000;
            
            // Calcolo bordo ripiani
            let perimetroRipiano = lati === 1 ? (larghVano/1000) : (larghVano*2 + P*2)/1000;
            metriBordo += rip * perimetroRipiano;
        }

        // Bordo scocca (fianchi e basi)
        let metriBordoScocca = lati === 1 ? (A*2 + L*2)/1000 : (A*4 + L*4 + P*8)/1000;
        metriBordo += metriBordoScocca;

        // TABELLA TAGLI
        const tbody = document.querySelector("#tabellaTagli tbody");
        tbody.innerHTML = `
            <tr><td>Fianchi Esterni</td><td>2</td><td>${A}</td><td>${P}</td><td>${((A*2/1000)*lati).toFixed(1)}</td></tr>
            <tr><td>Basi / Cappello</td><td>2</td><td>${L-(SP*2)}</td><td>${P}</td><td>${((L*2/1000)*lati).toFixed(1)}</td></tr>
            <tr><td>Ripiani Interni</td><td>${nRipiani}</td><td>${Math.round(larghVano-2)}</td><td>${P-20}</td><td>${(metriBordo - metriBordoScocca).toFixed(1)}</td></tr>
        `;

        // CALCOLO FINALE
        let mqScocca = ((A*P*2) + (L*P*2) + (L*A) + (nRipiani*larghVano*P)) / 1000000;
        let costoScocca = mqScocca * 1.15 * pM; // 15% sfrido
        let costoAnte = mqAnte * 150; // Prezzo forfettario mdf/laccatura se non scelto altro
        let costoBordiTot = metriBordo * cBordoMt;
        
        let totale = (costoScocca + costoAnte + costoBordiTot) * ricarico;

        document.getElementById('totale-big').innerText = `€ ${totale.toFixed(2)}`;
        document.getElementById('tabellaCosti').innerHTML = `
            <tr><td>Materiale Pannelli</td><td class="valore-analitico">€ ${costoScocca.toFixed(2)}</td></tr>
            <tr><td>Bordatura (${metriBordo.toFixed(1)} m)</td><td class="valore-analitico">€ ${costoBordiTot.toFixed(2)}</td></tr>
            <tr><td>Mq Ante totali</td><td class="valore-analitico">${mqAnte.toFixed(2)} mq</td></tr>
        `;

        // SVG
        const s = 250 / Math.max(L, A); // Scala automatica per il box
        let svg = `<svg width="${L*s + 20}" height="${A*s + 20}" viewBox="0 0 ${L*s + 20} ${A*s + 20}">
            <rect x="10" y="10" width="${L*s}" height="${(A-Z)*s}" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
            <rect x="10" y="${(A-Z)*s + 10}" width="${L*s}" height="${Z*s}" fill="#95a5a6" stroke="#2c3e50"/>`;
        for(let i=0; i<nD; i++) {
            svg += `<rect x="${10 + (larghVano*(i+1) + SP*i + SP)*s}" y="10" width="${SP*s}" height="${(A-Z)*s}" fill="#eee" stroke="#7f8c8d"/>`;
        }
        svg += `</svg>`;
        document.getElementById('svgContainer').innerHTML = svg;
    }

    function stampaCliente() {
        document.getElementById('sezioneTagli').style.display = 'none';
        window.print();
        setTimeout(() => document.getElementById('sezioneTagli').style.display = 'block', 1000);
    }

    document.addEventListener('DOMContentLoaded', initVani);
</script>
</body>
</html>
