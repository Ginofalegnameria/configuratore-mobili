<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Falegnameria Pro - Dettaglio Costi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: 450px 1fr; gap: 20px; align-items: start; }
        .section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { margin-top: 0; border-bottom: 2px solid #007bff; padding-bottom: 8px; color: #007bff; font-size: 1.1em; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.8em; font-weight: bold; display: block; margin-bottom: 4px; color: #555; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .row-item { background: #f8f9fa; padding: 12px; border-radius: 8px; border-left: 4px solid #007bff; margin-bottom: 10px; }
        #svgContainer { background: white; padding: 20px; border: 1px solid #ddd; border-radius: 8px; display: flex; justify-content: center; min-height: 400px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; font-size: 0.85em; }
        th { background: #007bff; color: white; }
        .result-box { background: #2c3e50; color: white; padding: 25px; border-radius: 12px; }
        #totale-big { font-size: 42px; font-weight: bold; color: #2ecc71; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .controlli-stampa { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 10px; z-index: 1000; }
        .btn { padding: 12px 20px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; color: white; }
        .btn-tech { background: #7f8c8d; }
        .btn-client { background: #27ae60; }
        .valore-r { text-align: right; }

        @media print {
            .no-print, .controlli-stampa { display: none !important; }
            .wrapper { display: block; }
            .section { box-shadow: none; border: none; padding: 0; }
            body.print-tech .result-box { display: none !important; }
            body.print-client #sezione-tagli { display: none !important; }
            body.print-client .result-box { background: white !important; color: black !important; border: 1px solid #333; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="input-col no-print">
        <div class="section">
            <h3>DATI GENERALI</h3>
            <label>CLIENTE</label>
            <input type="text" id="nomeCliente" placeholder="Nome Progetto" oninput="aggiorna()">
            <div class="input-grid" style="margin-top:10px;">
                <div><label>MATERIALE</label>
                    <select id="mat" onchange="aggiorna()">
                        <option value="25">Truciolare (25€/mq)</option>
                        <option value="55" selected>Laminato (55€/mq)</option>
                        <option value="95">Laccato (95€/mq)</option>
                    </select>
                </div>
                <div><label>COSTO BORDO (€/m)</label><input type="number" id="costoBordo" value="1.50" oninput="aggiorna()"></div>
            </div>
            <div class="input-grid" style="margin-top:10px;">
                <div><label>TARIFFA ORARIA (€)</label><input type="number" id="tariffaOraria" value="45" oninput="aggiorna()"></div>
                <div><label>TRASPORTO (€)</label><input type="number" id="costoTrasporto" value="150" oninput="aggiorna()"></div>
            </div>
        </div>

        <div class="section">
            <h3>STRUTTURA (mm)</h3>
            <div class="input-grid">
                <div><label>Larghezza (L)</label><input type="number" id="L" value="1200" oninput="aggiorna()"></div>
                <div><label>Altezza (A)</label><input type="number" id="A" value="2000" oninput="aggiorna()"></div>
                <div><label>Profondità (P)</label><input type="number" id="P" value="600" oninput="aggiorna()"></div>
                <div><label>Zoccolo</label><input type="number" id="Z" value="100" oninput="aggiorna()"></div>
                <div><label>Spessore</label><input type="number" id="SP" value="19" oninput="aggiorna()"></div>
                <div><label>N. Divisori</label><input type="number" id="nD" value="1" min="0" oninput="initVani()"></div>
            </div>
        </div>

        <div class="section">
            <h3>CONFIGURAZIONE VANI</h3>
            <div id="contVani"></div>
        </div>
    </div>

    <div class="output-col">
        <div class="section">
            <h1 id="labelCli" style="margin:0; text-align: center; color:#007bff;">PREVENTIVO</h1>
            <div id="svgContainer"></div>
        </div>

        <div class="section" id="sezione-tagli">
            <h3>DISTINTA TECNICA E BORDI</h3>
            <table id="tabellaTagli">
                <thead><tr><th>Pezzo</th><th>Q.tà</th><th>H</th><th>L</th><th>Bordo / Note</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="result-box">
            <div id="totale-big">€ 0,00</div>
            <p style="text-align:center; font-size:0.8em; margin-bottom:10px; color:#bdc3c7;">DETTAGLIO COSTI ANALITICI</p>
            <table style="width:100%; color:white; border:none; font-size: 0.9em;" id="tabellaCosti"></table>
        </div>
    </div>
</div>

<div class="controlli-stampa no-print">
    <button class="btn btn-tech" onclick="stampa('tech')">🖨️ STAMPA TECNICA</button>
    <button class="btn btn-client" onclick="stampa('client')">📄 EXPORT CLIENTE</button>
</div>

<script>
    function initVani() {
        const n = parseInt(document.getElementById('nD').value) || 0;
        const cont = document.getElementById('contVani');
        cont.innerHTML = "";
        for(let i=0; i <= n; i++) {
            cont.innerHTML += `
            <div class="row-item">
                <strong>Vano ${i+1}</strong>
                <div class="input-grid" style="margin-top:5px;">
                    <div><label>Ripiani</label><input type="number" id="q_${i}" value="1" oninput="aggiorna()"></div>
                    <div><label>Cassetti</label><input type="number" id="c_${i}" value="0" oninput="aggiorna()"></div>
                </div>
                <div style="display:flex; gap:15px; margin-top:10px;">
                    <label><input type="checkbox" id="asta_${i}" onchange="aggiorna()"> Asta</label>
                    <label><input type="checkbox" id="anta_${i}" checked onchange="aggiorna()"> Anta</label>
                </div>
            </div>`;
        }
        aggiorna();
    }

    function aggiorna() {
        const L=Number(document.getElementById('L').value), A=Number(document.getElementById('A').value), P=Number(document.getElementById('P').value), Z=Number(document.getElementById('Z').value), SP=Number(document.getElementById('SP').value), nD=Number(document.getElementById('nD').value), pM=Number(document.getElementById('mat').value), cB=Number(document.getElementById('costoBordo').value), tO=Number(document.getElementById('tariffaOraria').value), cT=Number(document.getElementById('costoTrasporto').value);
        
        document.getElementById('labelCli').innerText = (document.getElementById('nomeCliente').value || "Preventivo Progetto").toUpperCase();

        let nRipiani = 0, nCassetti = 0, mqAnte = 0, metriBordo = 0, nAste = 0;
        let larghVano = (L - (SP * 2) - (nD * SP)) / (nD + 1);

        const s = 350 / Math.max(L, A);
        let svg = `<svg width="${L*s + 20}" height="${A*s + 20}">`;
        
        // Fianchi a terra
        svg += `<rect x="10" y="10" width="${SP*s}" height="${A*s}" fill="#fff" stroke="#333" stroke-width="1.5"/>`;
        svg += `<rect x="${10 + (L-SP)*s}" y="10" width="${SP*s}" height="${A*s}" fill="#fff" stroke="#333" stroke-width="1.5"/>`;
        
        // Cappello e Base
        svg += `<rect x="${10 + SP*s}" y="10" width="${(L-SP*2)*s}" height="${SP*s}" fill="#fff" stroke="#333" stroke-width="1"/>`;
        svg += `<line x1="${10+SP*s}" y1="${10+SP*s}" x2="${10+(L-SP)*s}" y2="${10+SP*s}" stroke="#007bff" stroke-width="2"/>`; 
        svg += `<rect x="${10 + SP*s}" y="${10 + (A-Z-SP)*s}" width="${(L-SP*2)*s}" height="${SP*s}" fill="#fff" stroke="#333" stroke-width="1"/>`;
        svg += `<line x1="${10+SP*s}" y1="${10+(A-Z-SP)*s}" x2="${10+(L-SP)*s}" y2="${10+(A-Z-SP)*s}" stroke="#007bff" stroke-width="2"/>`;

        // Zoccolo
        svg += `<rect x="${10 + SP*s}" y="${10 + (A-Z)*s}" width="${(L-SP*2)*s}" height="${Z*s}" fill="#ccc" stroke="#333"/>`;

        metriBordo += (A*2 + L*2) / 1000;
        let rows = `<tr><td>Fianchi Esterni</td><td>2</td><td>${A}</td><td>${P}</td><td>Front H</td></tr>
                    <tr><td>Base e Cappello</td><td>2</td><td>${L-(SP*2)}</td><td>${P}</td><td>Front L</td></tr>`;

        for(let i=0; i <= nD; i++) {
            let xVano = 10 + (SP*s) + (i * (larghVano + SP) * s);
            let rip = Number(document.getElementById('q_'+i)?.value) || 0;
            let cass = Number(document.getElementById('c_'+i)?.value) || 0;
            let asta = document.getElementById('asta_'+i)?.checked;
            let anta = document.getElementById('anta_'+i)?.checked;
            nRipiani += rip; nCassetti += cass; if(asta) nAste++;

            if(i < nD) svg += `<rect x="${xVano + larghVano*s}" y="${10+SP*s}" width="${SP*s}" height="${(A-Z-SP*2)*s}" fill="#ddd" stroke="#333"/>`;

            for(let r=1; r<=rip; r++) {
                let yR = 10 + SP*s + ((A-Z-SP*2)*s / (rip+1)) * r;
                svg += `<rect x="${xVano}" y="${yR}" width="${larghVano*s}" height="${SP*s}" fill="#fff" stroke="#333" stroke-width="1"/>`;
                svg += `<line x1="${xVano}" y1="${yR}" x2="${xVano + larghVano*s}" y2="${yR}" stroke="#007bff" stroke-width="2"/>`;
            }
            
            if(asta) {
                let yAsta = 10 + (SP+150)*s;
                svg += `<circle cx="${xVano + (larghVano*s)/2}" cy="${yAsta}" r="${8*s}" fill="#777" />`;
                svg += `<line x1="${xVano}" y1="${yAsta}" x2="${xVano + larghVano*s}" y2="${yAsta}" stroke="#777" stroke-width="2"/>`;
            }

            for(let c=0; c<cass; c++) svg += `<rect x="${xVano+2}" y="${10+(A-Z-SP)*s - (c*150*s) - 150*s}" width="${larghVano*s-4}" height="${145*s}" fill="none" stroke="#e67e22"/>`;
            
            if(anta) {
                svg += `<rect x="${xVano}" y="10" width="${larghVano*s}" height="${(A-Z)*s}" fill="rgba(46, 204, 113, 0.05)" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2"/>`;
                mqAnte += ((A-Z)*larghVano)/1000000;
            }
        }

        metriBordo += (nRipiani * larghVano) / 1000;
        rows += `<tr><td>Divisori</td><td>${nD}</td><td>${A-Z-(SP*2)}</td><td>${P-20}</td><td>Front H</td></tr>`;
        rows += `<tr><td>Ripiani</td><td>${nRipiani}</td><td>${Math.round(larghVano-2)}</td><td>${P-20}</td><td>Front L</td></tr>`;
        
        document.querySelector("#tabellaTagli tbody").innerHTML = rows;
        document.getElementById('svgContainer').innerHTML = svg + "</svg>";
        
        // CALCOLO ANALITICO COSTI
        let mqLegno = (( (A*P*2)+(L*P*2)+(L*A)+(nRipiani*larghVano*P)+(nD*(A-Z-SP*2)*P) )/1000000) * 1.2;
        let costoLegno = mqLegno * pM;
        let costoBordi = metriBordo * cB;
        let costoAnte = mqAnte * 120; // Costo mq anta finita
        let costoFerramenta = (nCassetti * 45) + (nAste * 10) + (nRipiani * 2) + 20; 
        
        let oreLavoro = (mqLegno * 2) + (nCassetti * 1.5) + (mqAnte * 1);
        let costoManoOpera = oreLavoro * tO;
        
        let subTotale = costoLegno + costoBordi + costoAnte + costoFerramenta + costoManoOpera + cT;
        let iva = subTotale * 0.22;
        let totaleFinito = subTotale + iva;

        document.getElementById('totale-big').innerText = `€ ${totaleFinito.toFixed(2)}`;
        document.getElementById('tabellaCosti').innerHTML = `
            <tr><td>Legno (${mqLegno.toFixed(2)} mq)</td><td class="valore-r">€ ${costoLegno.toFixed(2)}</td></tr>
            <tr><td>Bordo (${metriBordo.toFixed(1)} m)</td><td class="valore-r">€ ${costoBordi.toFixed(2)}</td></tr>
            <tr><td>Ante (${mqAnte.toFixed(2)} mq)</td><td class="valore-r">€ ${costoAnte.toFixed(2)}</td></tr>
            <tr><td>Ferramenta</td><td class="valore-r">€ ${costoFerramenta.toFixed(2)}</td></tr>
            <tr><td>Manodopera (${oreLavoro.toFixed(1)} h)</td><td class="valore-r">€ ${costoManoOpera.toFixed(2)}</td></tr>
            <tr><td>Trasporto</td><td class="valore-r">€ ${cT.toFixed(2)}</td></tr>
            <tr style="border-top:2px solid #555"><td><strong>IMPONIBILE</strong></td><td class="valore-r"><strong>€ ${subTotale.toFixed(2)}</strong></td></tr>
            <tr><td>IVA (22%)</td><td class="valore-r">€ ${iva.toFixed(2)}</td></tr>
        `;
    }

    function stampa(tipo) {
        document.body.className = 'print-' + tipo;
        window.print();
    }
    document.addEventListener('DOMContentLoaded', initVani);
</script>
</body>
</html>
