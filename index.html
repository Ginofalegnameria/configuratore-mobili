<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Mobile con Anteprima</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        .preview-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1.5; min-width: 350px; display: flex; flex-direction: column; align-items: center; }
        h2, h3 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .result-box { margin-top: 20px; padding: 15px; background: #28a745; color: white; border-radius: 8px; text-align: center; font-size: 24px; font-weight: bold; }
        svg { background-color: #fff; border: 1px solid #eee; max-width: 100%; height: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8em; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- INPUT DATI -->
    <div class="card">
        <h2>Parametri</h2>
        <div class="grid">
            <div><label>Larghezza (mm)</label><input type="number" id="L" value="1000" oninput="calcola()"></div>
            <div><label>Altezza (mm)</label><input type="number" id="A" value="2000" oninput="calcola()"></div>
            <div><label>Profondità (mm)</label><input type="number" id="P" value="600" oninput="calcola()"></div>
            <div><label>Zoccolo (mm)</label><input type="number" id="Z" value="100" oninput="calcola()"></div>
            <div><label>Spessore (mm)</label><input type="number" id="SP" value="19" oninput="calcola()"></div>
            <div><label>Mat. €/mq</label><input type="number" id="prezzoMq" value="50" oninput="calcola()"></div>
        </div>

        <div style="margin-top:15px; padding:10px; background:#e9ecef; border-radius:8px;">
            <label><input type="checkbox" id="hasDiv" onchange="calcola()"> Divisorio Centrale</label>
            <div id="vaniInputs" style="display:none; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <div><label>Ripiani SX</label><input type="number" id="nSX" value="2" oninput="calcola()"></div>
                <div><label>Ripiani DX</label><input type="number" id="nDX" value="2" oninput="calcola()"></div>
            </div>
        </div>
        <div class="result-box" id="totale">€ 0.00</div>
    </div>

    <!-- ANTEPRIMA VISIVA -->
    <div class="preview-card">
        <h3>Anteprima Frontale</h3>
        <svg id="disegno" width="400" height="500" viewBox="0 0 400 500"></svg>
        
        <h3>Distinta Tagli</h3>
        <table id="tabellaTagli">
            <thead><tr><th>Pezzo</th><th>Q.tà</th><th>A</th><th>B</th></tr></thead>
            <tbody id="corpoTabella"></tbody>
        </table>
    </div>
</div>

<script>
    function calcola() {
        const L = parseFloat(document.getElementById('L').value) || 0;
        const A = parseFloat(document.getElementById('A').value) || 0;
        const P = parseFloat(document.getElementById('P').value) || 0;
        const Z = parseFloat(document.getElementById('Z').value) || 0;
        const SP = parseFloat(document.getElementById('SP').value) || 0;
        const pMq = parseFloat(document.getElementById('prezzoMq').value) || 0;
        const hasDiv = document.getElementById('hasDiv').checked;
        document.getElementById('vaniInputs').style.display = hasDiv ? 'grid' : 'none';

        // Disegno SVG (proporzionato)
        const scala = 450 / Math.max(L, A);
        const w = L * scala;
        const h = A * scala;
        const sp = SP * scala;
        const z = Z * scala;
        
        let svgHtml = `<rect x="10" y="10" width="${w}" height="${h}" fill="none" stroke="#333" stroke-width="2"/>`; // Ingombro
        svgHtml += `<rect x="10" y="${10+h-z}" width="${w}" height="${z}" fill="#ddd" stroke="#333" />`; // Zoccolo
        
        // Struttura esterna
        svgHtml += `<rect x="${10+sp}" y="10" width="${w-sp*2}" height="${sp}" fill="#bbb" />`; // Top
        svgHtml += `<rect x="${10+sp}" y="${10+h-z-sp}" width="${w-sp*2}" height="${sp}" fill="#bbb" />`; // Base

        if (hasDiv) {
            svgHtml += `<rect x="${10 + w/2 - sp/2}" y="${10+sp}" width="${sp}" height="${h-z-sp*2}" fill="#bbb" />`;
            const nSX = parseInt(document.getElementById('nSX').value) || 0;
            for(let i=1; i<=nSX; i++) {
                let yR = 10 + (h-z)/(nSX+1) * i;
                svgHtml += `<line x1="${10+sp}" y1="${yR}" x2="${10+w/2-sp/2}" y2="${yR}" stroke="#666" stroke-dasharray="4"/>`;
            }
            const nDX = parseInt(document.getElementById('nDX').value) || 0;
            for(let i=1; i<=nDX; i++) {
                let yR = 10 + (h-z)/(nDX+1) * i;
                svgHtml += `<line x1="${10+w/2+sp/2}" y1="${yR}" x2="${10+w-sp}" y2="${yR}" stroke="#666" stroke-dasharray="4"/>`;
            }
        }

        document.getElementById('disegno').innerHTML = svgHtml;

        // Logica Prezzo e Tagli (Semplificata per brevità)
        let sup = (L*A*2 + L*P*2 + A*P*2) / 1000000;
        document.getElementById('totale').innerText = "€ " + (sup * pMq * 1.2).toFixed(2);
        
        // Tabella Tagli
        let rows = `<tr><td>Fianchi</td><td>2</td><td>${A-Z}</td><td>${P}</td></tr>`;
        rows += `<tr><td>Base/Top</td><td>2</td><td>${L-SP*2}</td><td>${P}</td></tr>`;
        document.getElementById('corpoTabella').innerHTML = rows;
    }
    window.onload = calcola;
</script>
</body>
</html>

</html>
