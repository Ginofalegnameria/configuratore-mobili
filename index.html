<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventivatore Professionale Falegnameria</title>
    <!-- Usiamo una versione stabile e collaudata di html2pdf -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1300px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 350px; }
        .preview-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1.5; min-width: 400px; display: flex; flex-direction: column; align-items: center; }
        h2, h3 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row-item { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #28a745; }
        .result-box { margin-top: 20px; padding: 20px; background: #2c3e50; color: white; border-radius: 8px; width: 100%; }
        #totale { font-size: 32px; font-weight: bold; color: #2ecc71; text-align:center; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .tech-table { width: 100%; font-size: 0.85em; border-collapse: collapse; }
        .tech-table td { padding: 5px 0; border-bottom: 1px solid #444; color: #ecf0f1; }
        .valore { text-align: right; font-weight: bold; }
        svg { background: #fff; border: 1px solid #ddd; width: 100%; height: auto; max-width: 400px; }
        table.distinta { width: 100%; border-collapse: collapse; font-size: 0.75em; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #007bff; color: white; }
        .btn-export { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Dati Cliente</h2>
        <input type="text" id="nomeCliente" placeholder="Nome Cliente" oninput="document.getElementById('cliLabel').innerText='Cliente: '+this.value" style="margin-bottom:15px; border:2px solid #007bff;">
        
        <h2>Parametri Struttura</h2>
        <div class="grid">
            <div><label>L (mm)</label><input type="number" id="L" value="1000" oninput="run()"></div>
            <div><label>A (mm)</label><input type="number" id="A" value="2000" oninput="run()"></div>
            <div><label>P (mm)</label><input type="number" id="P" value="600" oninput="run()"></div>
            <div><label>Zoccolo</label><input type="number" id="Z" value="100" oninput="run()"></div>
            <div><label>Spessore</label><input type="number" id="SP" value="19" oninput="run()"></div>
            <div><label>Operaio €/h</label><input type="number" id="TarH" value="80" oninput="run()"></div>
        </div>

        <div class="grid">
            <div><label>Materiale</label><select id="mat" onchange="run()"><option value="25">Truciolare</option><option value="55" selected>Laminato</option></select></div>
            <div><label>Bordo</label><select id="spB" onchange="run()"><option value="1.20">0.4mm</option><option value="1.80" selected>1mm</option></select></div>
        </div>

        <h3>Vani</h3>
        <input type="number" id="numDiv" value="1" min="0" oninput="run()">
        <div id="contRipiani" style="margin-top:10px;"></div>

        <button class="btn-export" onclick="salvaPDF()">📥 SCARICA PDF</button>
    </div>

    <!-- AREA STAMPA -->
    <div class="preview-card" id="area-stampa">
        <div style="width:100%; border-bottom:3px solid #333; margin-bottom:15px;">
            <h1 style="margin:0;">PREVENTIVO TECNICO</h1>
            <p id="cliLabel" style="font-size:1.2em; font-weight:bold; color:#007bff;">Cliente: Da definire</p>
        </div>

        <!-- Il disegno viene renderizzato qui -->
        <div id="canvas-wrap">
            <svg id="disegno" viewBox="0 0 500 550" width="400" height="440"></svg>
        </div>

        <div class="result-box" style="background:#f8f9fa!important; color:black!important; border:1px solid #ccc;">
            <div id="totale" style="color:#27ae60!important;">€ 0.00</div>
            <table class="tech-table" id="report" style="color:#333!important;"></table>
        </div>

        <table class="distinta">
            <thead><tr><th>Pezzo</th><th>Q.tà</th><th>H</th><th>L</th><th>Bordo</th></tr></thead>
            <tbody id="corpoT"></tbody>
        </table>
    </div>
</div>

<script>
    function run() {
        const n = parseInt(document.getElementById('numDiv').value) || 0;
        const cont = document.getElementById('contRipiani');
        if(cont.dataset.num != n) {
            let h = "";
            for(let i=0; i<=n; i++) h += `<div class="row-item"><strong>Vano ${i+1}</strong><div class="grid"><div><label>Ripiani</label><input type="number" id="q_${i}" value="1" oninput="calcola()"></div><div><label>Interasse</label><input type="number" id="int_${i}" value="320" oninput="calcola()"></div></div><input type="checkbox" id="a_${i}" onchange="calcola()"> Asta</div>`;
            cont.innerHTML = h; cont.dataset.num = n;
        }
        calcola();
    }

    function calcola() {
        const L=parseFloat(document.getElementById('L').value), A=parseFloat(document.getElementById('A').value), P=parseFloat(document.getElementById('P').value), Z=parseFloat(document.getElementById('Z').value), SP=parseFloat(document.getElementById('SP').value), TH=parseFloat(document.getElementById('TarH').value), nD=parseInt(document.getElementById('numDiv').value), pM=parseFloat(document.getElementById('mat').value), pB=parseFloat(document.getElementById('spB').value);
        const lV = (L - (SP*2) - (nD*SP)) / (nD+1);
        let mqS=0, mlB=0, nA=0, hT="";
        const sc=400/Math.max(L,A), w=L*sc, h=A*sc, sp=SP*sc, z=Z*sc;

        let svg = `<rect x="25" y="25" width="${w}" height="${h-z}" fill="#f9f9f9" stroke="#ccc"/>`;
        svg += `<rect x="25" y="25" width="${sp}" height="${h}" fill="#bbb" stroke="#333"/><rect x="${25+w-sp}" y="25" width="${sp}" height="${h}" fill="#bbb" stroke="#333"/>`;
        svg += `<rect x="${25+sp}" y="${25+h-z}" width="${w-sp*2}" height="${z}" fill="#ddd" stroke="#333"/><rect x="${25+sp}" y="${25+h-z-sp}" width="${w-sp*2}" height="${sp}" fill="#bbb" stroke="#333"/><rect x="${25+sp}" y="25" width="${w-sp*2}" height="${sp}" fill="#bbb" stroke="#333"/>`;

        for(let i=0; i<=nD; i++) {
            let q = parseInt(document.getElementById(`q_${i}`)?.value)||0, it = parseFloat(document.getElementById(`int_${i}`)?.value)||320, xV = 25+sp+(i*(lV*sc+sp));
            if(q>0) {
                mlB += ((lV+P-20)*2/1000)*q; mqS += (lV*(P-20)*q)/1000000;
                for(let j=1; j<=q; j++) { let yR = 25+h-z-sp-(it*j*sc); if(yR>25+sp) svg += `<rect x="${xV}" y="${yR}" width="${lV*sc}" height="${sp/2}" fill="#3498db" opacity="0.6"/>`; }
            }
            if(document.getElementById(`a_${i}`)?.checked) { nA++; svg += `<rect x="${xV}" y="${25+sp+40*sc}" width="${lV*sc}" height="6" fill="#95a5a6"/>`; }
            if(i<nD) svg += `<rect x="${xV+lV*sc}" y="${25+sp}" width="${sp}" height="${h-z-sp*2}" fill="#aaa" stroke="#333"/>`;
        }

        let ore = 2+(mqS*1.2)+(mlB*0.08)+(nA*0.3), imp = (mqS*pM*1.25)+(mlB*pB)+(ore*TH)+80;
        document.getElementById('disegno').innerHTML = svg;
        document.getElementById('totale').innerText = "€ " + (imp*1.22).toFixed(2);
        document.getElementById('report').innerHTML = `<tr><td>Materiale</td><td class="valore">€ ${(mqS*pM*1.25).toFixed(2)}</td></tr><tr><td>Lavorazione (${ore.toFixed(1)}h)</td><td class="valore">€ ${(ore*TH).toFixed(2)}</td></tr><tr><td>IVA + Spese</td><td class="valore">€ ${(imp*0.22+80).toFixed(2)}</td></tr>`;
    }

    function salvaPDF() {
        const element = document.getElementById('area-stampa');
        const opt = { margin: 10, filename: 'Preventivo.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        html2pdf().set(opt).from(element).save();
    }

    window.onload = run;
</script>
</body>
</html>
