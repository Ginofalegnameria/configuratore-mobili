<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Tecnico Avanzato</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1300px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 350px; }
        .preview-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1.5; min-width: 400px; }
        h2, h3 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row-item { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #007bff; }
        .result-box { margin-top: 20px; padding: 15px; background: #2c3e50; color: white; border-radius: 8px; text-align: center; }
        #totale { font-size: 32px; font-weight: bold; color: #2ecc71; }
        .info-prezzo { font-size: 0.85em; text-align: left; margin-top: 10px; color: #ecf0f1; border-top: 1px solid #555; pt: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8em; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Parametri Struttura</h2>
        <div class="grid">
            <div><label>Larghezza (mm)</label><input type="number" id="L" value="1000" oninput="run()"></div>
            <div><label>Altezza (mm)</label><input type="number" id="A" value="2000" oninput="run()"></div>
            <div><label>Profondità (mm)</label><input type="number" id="P" value="600" oninput="run()"></div>
            <div><label>Zoccolo (mm)</label><input type="number" id="Z" value="100" oninput="run()"></div>
            <div><label>Spessore (mm)</label><input type="number" id="SP" value="19" oninput="run()"></div>
        </div>

        <label>Materiale</label>
        <select id="mat" onchange="run()" style="margin-bottom: 15px;">
            <option value="25">Truciolare Melaminico Bianco (25€/mq)</option>
            <option value="35">Truciolare Melaminico Legno (35€/mq)</option>
            <option value="55" selected>Laminato Standard (55€/mq)</option>
            <option value="120">Laccato Opaco (120€/mq)</option>
        </select>

        <h3>Allestimento Vani</h3>
        <label>N° Divisori Verticali</label>
        <input type="number" id="numDiv" value="1" min="0" oninput="run()">
        <div id="contRipiani" style="margin-top:10px;"></div>

        <div class="result-box">
            <span>Totale Stimato (IVA incl.)</span>
            <div id="totale">€ 0.00</div>
            <div id="dettaglioCosti" class="info-prezzo"></div>
        </div>
    </div>

    <div class="preview-card">
        <h3>Distinta Tagli e Componenti</h3>
        <table id="tabellaTagli">
            <thead><tr><th>Pezzo</th><th>Q.tà</th><th>H (mm)</th><th>L (mm)</th><th>Bordo (m)</th></tr></thead>
            <tbody id="corpoTabella"></tbody>
        </table>
    </div>
</div>

<script>
    function run() { renderInputs(); calcola(); }

    function renderInputs() {
        const n = parseInt(document.getElementById('numDiv').value) || 0;
        const cont = document.getElementById('contRipiani');
        let html = "";
        for(let i=0; i <= n; i++) {
            html += `<div class="row-item">
                <strong>Vano ${i+1}</strong>
                <div class="grid">
                    <div><label>Ripiani</label><input type="number" id="rip_qta_${i}" value="1" oninput="calcola()"></div>
                    <div style="display:flex; align-items:center; mt:20px;">
                        <input type="checkbox" id="asta_${i}" onchange="calcola()"> <label>Appendiabiti</label>
                    </div>
                </div></div>`;
        }
        if(cont.dataset.num != n) { cont.innerHTML = html; cont.dataset.num = n; }
    }

    function calcola() {
        const L = parseFloat(document.getElementById('L').value) || 0;
        const A = parseFloat(document.getElementById('A').value) || 0;
        const P = parseFloat(document.getElementById('P').value) || 0;
        const Z = parseFloat(document.getElementById('Z').value) || 0;
        const SP = parseFloat(document.getElementById('SP').value) || 0;
        const nDiv = parseInt(document.getElementById('numDiv').value) || 0;
        const prezzoMq = parseFloat(document.getElementById('mat').value);

        const hFianco = A - Z;
        const lVano = (L - (SP * 2) - (nDiv * SP)) / (nDiv + 1);

        let pezzi = [
            { n: "Fianchi Esterni", q: 2, a: hFianco, b: P },
            { n: "Base + Top", q: 2, a: L - (SP*2), b: P },
            { n: "Zoccoli", q: 2, a: L, b: Z },
            { n: "Schienali", q: nDiv + 1, a: hFianco, b: lVano + SP }
        ];

        if(nDiv > 0) pezzi.push({ n: "Divisori", q: nDiv, a: hFianco - (SP*2), b: P - 20 });

        let mqTot = 0;
        let mlBordo = 0;
        let htmlT = "";
        let numAste = 0;

        // Calcolo Pezzi e Bordatura Reale
        pezzi.forEach(p => {
            let bordoPezzo = ((p.a + p.b) * 2 / 1000) * p.q;
            mlBordo += bordoPezzo;
            mqTot += (p.a * p.b * p.q) / 1000000;
            htmlT += `<tr><td>${p.n}</td><td>${p.q}</td><td>${Math.round(p.a)}</td><td>${Math.round(p.b)}</td><td>${bordoPezzo.toFixed(2)}</td></tr>`;
        });

        // Ripiani e Aste per vano
        for(let i=0; i <= nDiv; i++) {
            let qtaR = parseInt(document.getElementById(`rip_qta_${i}`)?.value) || 0;
            if(qtaR > 0) {
                let bR = ((lVano + P - 20) * 2 / 1000) * qtaR;
                mlBordo += bR;
                mqTot += (lVano * (P - 20) * qtaR) / 1000000;
                htmlT += `<tr><td>Ripiani Vano ${i+1}</td><td>${qtaR}</td><td>${Math.round(lVano)}</td><td>${Math.round(P-20)}</td><td>${bR.toFixed(2)}</td></tr>`;
            }
            if(document.getElementById(`asta_${i}`)?.checked) numAste++;
        }

        // Calcolo Cerniere (1 ogni 70cm, min 2 per anta. Assumiamo 1 anta per vano)
        let cernierePerAnta = Math.max(2, Math.ceil(hFianco / 700));
        let totCerniere = cernierePerAnta * (nDiv + 1);

        // --- COSTI ---
        let costoPannelli = mqTot * prezzoMq * 1.2; // 20% sfrido
        let costoBordatura = mlBordo * 1.50; // 1.50€ al metro lineare
        let costoCerniere = totCerniere * 4.50; // 4.50€ a cerniera (Blum o simili)
        let costoAste = numAste * 12.00; // 12€ kit asta + supporti
        let lavorazione = 80; // Fisso foratura e taglio

        let totale = (costoPannelli + costoBordatura + costoCerniere + costoAste + lavorazione) * 1.22;

        document.getElementById('corpoTabella').innerHTML = htmlT;
        document.getElementById('totale').innerText = "€ " + totale.toFixed(2);
        document.getElementById('dettaglioCosti').innerHTML = `
            Bordo: ${mlBordo.toFixed(2)} m | Cerniere: ${totCerniere} pz | Aste: ${numAste}`;
    }
    window.onload = run;
</script>
</body>
</html>
