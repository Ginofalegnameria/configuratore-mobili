<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Falegnameria Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper">
    <!-- COLONNA DI SINISTRA: INPUT E PARAMETRI -->
    <div class="input-col no-print">
        
        <!-- DATI GENERALI -->
        <div class="section">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>DATI GENERALI</h3>
                <button id="btnListino" class="btn btn-listino">⚙️ LISTINO</button>
            </div>
            <label for="tipoCommessa">TIPOLOGIA COMMESSA</label>
            <select id="tipoCommessa" style="margin-bottom: 10px; font-weight: bold; background: #eef5ff;">
                <option value="mobile">Cabinet / Mobile Standard</option>
                <option value="telaio">Telaio e Sportelli Laccati</option>
                <option value="paretina">Paretina a Frame Verticale</option>
                <option value="facciata">Ristrutturazione Facciata Esterna</option>
            </select>

            <label for="nomeCliente">CLIENTE</label>
            <input type="text" id="nomeCliente">
            
            <div id="materiali-standard-inputs">
                <div class="input-grid" style="margin-top:10px;">
                    <div>
                        <label for="mat">MATERIALE SCOCCA</label>
                        <select id="mat"></select>
                    </div>
                </div>
            </div>

            <div class="input-grid" style="margin-top:10px;">
                <div>
                    <label for="tariffaOraria">TARIFFA ORA (€)</label>
                    <input type="number" id="tariffaOraria" value="45">
                </div>
                <div>
                    <label for="costoBordo">BORDO (€/m)</label>
                    <input type="number" id="costoBordo" value="1.50">
                </div>
            </div>
            
            <label for="costoTrasporto" style="margin-top:10px;">TRASPORTO / TRASFERTA (€)</label>
            <input type="number" id="costoTrasporto" value="150">
        </div>

        <!-- PARAMETRI CABINET -->
        <div class="section" id="blocco-inputs-mobile" style="display:none;">
            <h3>PARAMETRI CABINET (mm)</h3>
            <div class="input-grid">
                <div><label for="L">Largh. L (mm)</label><input type="number" id="L" value="1200"></div>
                <div><label for="A">Alt. A (mm)</label><input type="number" id="A" value="2000"></div>
                <div><label for="P">Prof. P (mm)</label><input type="number" id="P" value="600"></div>
                <div><label for="Z">Zoccolo Z (mm)</label><input type="number" id="Z" value="100"></div>
                <div><label for="SP">Spessore SP (mm)</label><input type="number" id="SP" value="19"></div>
                <div><label for="nD">N. Divisori</label><input type="number" id="nD" value="0" min="0"></div>
            </div>
        </div>

        <!-- CONTENITORE DINAMICO LATI / VANI INTERNI -->
        <div id="contVani" style="display:none;"></div>

        <!-- PARAMETRI TELAIO -->
        <div class="section" id="blocco-inputs-telaio" style="display:none;">
            <h3>PARAMETRI TELAIO E SPORTELLI (mm)</h3>
            <div class="input-grid">
                <div><label>Larghezza Totale (mm)</label><input type="number" id="tL" value="750"></div>
                <div><label>Altezza Totale (mm)</label><input type="number" id="tA" value="2100"></div>
            </div>
        </div>

        <!-- PARAMETRI PARETINA -->
        <div class="section" id="blocco-inputs-paretina" style="display:none;">
            <h3>PARAMETRI PARETINA A LISTELLI</h3>
            <div class="input-grid">
                <div><label>Larghezza Tot. (cm)</label><input type="number" id="pLargh" value="120"></div>
                <div><label>Altezza Tot. (cm)</label><input type="number" id="pAlt" value="270"></div>
            </div>
        </div>
    </div>
    
    <!-- COLONNA DI DESTRA: ANTEPRIMA E PREVENTIVO -->
    <div class="output-col">
        <div class="section">
            <h3>ANTEPRIMA GRAFICA</h3>
            <div id="svgContainer">
                <svg id="configuratoreSvg" width="100%" height="400" viewBox="0 0 800 400"></svg>
            </div>
        </div>
        <div class="result-box">
            <h3>PREVENTIVO</h3>
            <div id="totale-big">€ 0.00</div>
            <table id="tabella-dettagli" style="margin-top: 20px; color: white; border-color: #444;"></table>
        </div>
    </div>
</div>

<!-- CONTROLLI DI STAMPA -->
<div class="controlli-stampa no-print">
    <button id="btnPrintTech" class="btn btn-tech">🖨️ Stampa Tecnica</button>
    <button id="btnPrintClient" class="btn btn-client">📄 Stampa Cliente</button>
</div>

<!-- FINESTRA MODALE LISTINO -->
<div id="modalListino">
    <div class="modal-content">
        <h3>GESTIONE LISTINO PREZZI</h3>
        <div id="contenutoListino"></div>
        <button id="btnChiudiModal" class="btn btn-tech" style="float:right; margin-top:10px;">Chiudi</button>
    </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
