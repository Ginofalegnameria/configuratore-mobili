<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuratore Falegnameria - Default Clean</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1300px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1; min-width: 350px; }
        .preview-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex: 1.5; min-width: 400px; display: flex; flex-direction: column; align-items: center; }
        h2, h3 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .row-item { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #28a745; }
        .result-box { margin-top: 20px; padding: 20px; background: #2c3e50; color: white; border-radius: 8px; width: 100%; }
        #totale { font-size: 32px; font-weight: bold; color: #2ecc71; text-align:center; }
        .dettaglio-prezzo { font-size: 0.85em; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-top: 1px solid #555; padding-top: 10px; margin-top:10px; }
        svg { background: #fff; border: 1px solid #ddd; width: 100%; height: auto; max-width: 420px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75em; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Parametri Struttura</h2>
        <div class="grid">
            <div><label>Larghezza (mm)</label><input type="number" id="L" value="1000" oninput="run()"></div>
            <div><label>Altezza (mm)</label><input type="number" id="A" value="2000" oninput="run()"></div>
            <div><label>Profondità (mm)</label><input type="number" id="P" value="600" oninput="run()"></div>
            <div><label>Zoccolo (mm)</label><input type="number" id="Z" value="100" oninput="run()"></div>
            <div><label>Spessore Scocca</label><input type="number" id="SP" value="19" oninput="run()"></div>
            <div><label>Sp. Schienale</label><select id="SPS" onchange="run()"><option value="4">4 mm</option><option value="8">8 mm</option><option value="10">10 mm</option></select></div>
        </div>

        <label>Materiale</label>
        <select id="mat" onchange="run()" style="margin-bottom: 15px;">
            <option value="25">Truciolare Melaminico (25€/mq)</option>
            <option value="55" selected>Laminato Standard (55€/mq)</option>
            <option value="120">Laccato Opaco (120€/mq)</option>
        </select>

        <h3>Vani e Allestimento</h3>
        <label>Numero Divisori Verticali</label>
        <input type="number" id="numDiv" value="0" min="0" max="10" oninput="run()">
        <div id="contRipiani" style="margin-top:10px;"></div>

        <div class="result-box">
            <div id="totale">€ 0.00</div>
            <div id="dettaglioCosti" class="dettaglio-prezzo"></div>
        </div>
    </div>

    <div class="preview-card">
        <h3>Anteprima Tecnica 2D</h3>
        <svg id="disegno" viewBox="0 0 500 550"></svg>
        <h3>Distinta Tagli</h3>
        <table id="tabellaTagli">
            <thead><tr><th>Pezzo</th><th>Q.tà</th><th>H (mm)</th><th>L (mm)</th><th>Sp</th><th>Bordo (m)</th></tr></thead>
            <tbody id="corpoTabella"></tbody>
        </table>
    </div>
</div>

<script>
    function run() { renderInputs(); calcola(); }

    function renderInputs() {
        const n = parseInt(document.getElementById('numDiv').value) || 0;
        const cont = document.getElementById('contRipiani');
        let html = "";
        for(let i=0; i <= n; i++) {
            // Default a 0 ripiani per ogni vano
            html += `<div class="row-item"><strong>Vano ${i+1}</strong><div class="grid">
                <div><label>Ripiani</label><input type="number" id="rip_qta_${i}" value="0" min="0" oninput="calcola()"></div>
                <div style="padding-top:25px"><input type="checkbox" id="asta_${i}" onchange="calcola()"> <label>Asta Appendiabiti</label></div>
            </div></div>`;
        }
        if(cont.dataset.num != n) {
            cont.innerHTML = html;
            cont.dataset.num = n;
        }
    }

    function calcola() {
        const L = parseFloat(document.getElementById('L').value), A = parseFloat(document.getElementById('A').value), P = parseFloat(document.getElementById('P').value);
        const Z = parseFloat(document.getElementById('Z').value), SP = parseFloat(document.getElementById('SP').value), SPS = parseFloat(document.getElementById('SPS').value);
        const nDiv = parseInt(document.getElementById('numDiv').value), pMq = parseFloat(document.getElementById('mat').value);

        const lInternaVanoTot = L - (SP * 2) - (nDiv * SP);
        const lVano = lInternaVanoTot / (nDiv + 1);

        // Pezzi con logica Fianchi a Terra
        let pezzi = [
            { n: "Fianchi Esterni", q: 2, a: A, b: P, s: SP },
            { n: "Base + Top", q: 2, a: L - (SP*2), b: P, s: SP },
            { n: "Zoccoli", q: 2, a: L - (SP*2), b: Z, s: SP },
            { n: "Schienali", q: nDiv + 1, a: A - 5, b: lVano + SP, s: SPS }
        ];
        if(nDiv > 0) pezzi.push({ n: "Divisori", q: nDiv, a: A - Z - (SP*2), b: P - 20, s: SP });

        let mqStr = 0, mqSch = 0, mlB = 0, htmlT = "", numA = 0;

        // Disegno SVG
        const sc = 450 / Math.max(L, A), w = L*sc, h = A*sc, sp = SP*sc, z = Z*sc;
        let svg = `<rect x="25" y="25" width="${w}" height="${h}" fill="#f9f9f9" stroke="#ccc"/>`; 
        svg += `<rect x="25" y="25" width="${sp}" height="${h}" fill="#bbb" stroke="#333"/>`; // Fianco SX
        svg += `<rect x="${25+w-sp}" y="25" width="${sp}" height="${h}" fill="#bbb" stroke="#333"/>`; // Fianco DX
        svg += `<rect x="${25+sp}" y="${25+h-z}" width="${w-sp*2}" height="${z}" fill="#ddd" stroke="#333"/>`; // Zoccolo
        svg += `<rect x="${25+sp}" y="${25+h-z-sp}" width="${w-sp*2}" height="${sp}" fill="#bbb" stroke="#333"/>`; // Base
        svg += `<rect x="${25+sp}" y="25" width="${w-sp*2}" height="${sp}" fill="#bbb" stroke="#333"/>`; // Top

        pezzi.forEach(p => {
            let bP = (p.s > 4) ? ((p.a + p.b) * 2 / 1000) * p.q : 0;
            mlB += bP; 
            if(p.s > 4) mqStr += (p.a*p.b*p.q)/1000000; else mqSch += (p.a*p.b*p.q)/1000000;
            htmlT += `<tr><td>${p.n}</td><td>${p.q}</td><td>${Math.round(p.a)}</td><td>${Math.round(p.b)}</td><td>${p.s}</td><td>${bP.toFixed(2)}</td></tr>`;
        });

        for(let i=0; i <= nDiv; i++) {
            let qR = parseInt(document.getElementById(`rip_qta_${i}`)?.value) || 0;
            let xV = 25 + sp + (i * ( (lVano*sc) + sp ));
            if(qR > 0) {
                let bR = ((lVano + P - 20) * 2 / 1000) * qR; mlB += bR; mqStr += (lVano*(P-20)*qR)/1000000;
                htmlT += `<tr><td>Ripiani Vano ${i+1}</td><td>${qR}</td><td>${Math.round(lVano)}</td><td>${Math.round(P-20)}</td><td>${SP}</td><td>${bR.toFixed(2)}</td></tr>`;
                for(let j=1; j<=qR; j++) {
                    let yR = 25 + sp + ( (h-z-sp*2) / (qR+1) ) * j;
                    svg += `<rect x="${xV}" y="${yR}" width="${lVano*sc}" height="${sp/2}" fill="#3498db" opacity="0.6"/>`;
                }
            }
            if(document.getElementById(`asta_${i}`)?.checked) {
                numA++; svg += `<rect x="${xV+5}" y="${25+sp+40}" width="${lVano*sc-10}" height="4" rx="2" fill="#7f8c8d"/>`;
            }
            if(i < nDiv) svg += `<rect x="${xV + lVano*sc}" y="${25+sp}" width="${sp}" height="${h-z-sp*2}" fill="#aaa" stroke="#333"/>`;
        }

        let nCern = Math.max(2, Math.ceil((A-Z)/700)) * (nDiv+1);
        let c_mat = (mqStr * pMq * 1.25) + (mqSch * 15), c_bor = mlB * 1.8, c_fer = (nCern * 4.5) + (numA * 12), c_man = 150 + (mqStr * 15), c_tra = 80;
        let imp = c_mat + c_bor + c_fer + c_man + c_tra;

        document.getElementById('disegno').innerHTML = svg;
        document.getElementById('corpoTabella').innerHTML = htmlT;
        document.getElementById('totale').innerText = "€ " + (imp * 1.22).toFixed(2);
        document.getElementById('dettaglioCosti').innerHTML = `<span>Materiali:</span><b>€ ${c_mat.toFixed(2)}</b><span>Bordatura:</span><b>€ ${c_bor.toFixed(2)}</b><span>Ferramenta:</span><b>€ ${c_fer.toFixed(2)}</b><span>Manodopera:</span><b>€ ${c_man.toFixed(2)}</b><span>Trasporto:</span><b>€ ${c_tra.toFixed(2)}</b><span>IVA (22%):</span><b>€ ${(imp*0.22).toFixed(2)}</b>`;
    }
    window.onload = run;
</script>
</body>
</html>
